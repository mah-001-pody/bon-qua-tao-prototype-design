<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO-Express — MSB Open SCF Platform (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* MSB Open SCF · PO-Express — giao diện hi-fi (web desktop 1440) */
:root {
  --primary: #F26A21; --primary-600: #DD5716; --brand: #EF4029;
  --primary-50: #FEF3EC; --primary-100: #FDE3D2; --primary-border: #F6C4A6;
  --bg: #F5F6F8; --card: #FFFFFF; --line: #E6E8EC; --line2: #EFF1F4;
  --text: #1D2129; --text2: #5B6472; --text3: #8E96A3;
  --green: #12994A; --green-50: #E7F6EE; --red: #D63036; --red-50: #FDEDED;
  --amber: #B96A00; --amber-50: #FFF4DF; --blue: #2E7CF6; --blue-50: #EAF2FF;
  --dms: #0F766E; --dms-600: #0B5E58; --dms-50: #E5F3F1; --dms-head: #13233A;
  --shadow: 0 12px 32px rgba(16, 24, 40, .12), 0 2px 6px rgba(16, 24, 40, .06);
  --font: 'Be Vietnam Pro', 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--text); background: #DADDE3; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.export { background: var(--bg); }
button { font-family: inherit; }
.ic { width: 18px; height: 18px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text2); }
.faint { color: var(--text3); }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grid { display: grid; gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; }
.small { font-size: 12.5px; } .xs { font-size: 12px; }
b, strong { font-weight: 700; }

/* ---------- stage ---------- */
#stage { width: 1440px; margin: 0 auto; background: var(--bg); }
.screen { display: none; position: relative; width: 1440px; min-height: var(--h); background: var(--bg); overflow: hidden; }
.screen.active { display: block; }

/* ---------- MSB shell ---------- */
.msb { display: grid; grid-template-columns: 248px 1fr; min-height: var(--h); }
.msb-side { background: #fff; border-right: 1px solid var(--line); padding: 14px 12px 24px; }
.msb-logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; }
.logo-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #EF4029 0%, #F7851E 100%); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .3px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(239, 64, 41, .3); }
.logo-mark.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 8px; box-shadow: none; }
.logo-text b { display: block; font-size: 17px; font-weight: 800; letter-spacing: .1px; }
.logo-text small { display: block; font-size: 11px; color: var(--text3); margin-top: -1px; }
.msb-logo .collapse { margin-left: auto; color: var(--text3); }
.nav-h { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .5px; padding: 14px 10px 6px; }
.nav-h .ic { width: 14px; height: 14px; }
.nav-i { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: #2B3037; border: 1px solid transparent; cursor: default; }
.nav-i .ic { color: #66707D; }
.nav-i.active { background: var(--primary-50); border-color: var(--primary-border); color: var(--primary-600); font-weight: 600; }
.nav-i.active .ic { color: var(--primary); }
.nav-sub { display: flex; align-items: center; gap: 8px; margin: 2px 0 2px 29px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; color: var(--text2); border-left: 2px solid var(--line); border-radius: 0 8px 8px 0; }
.nav-sub.active { background: var(--primary-50); color: var(--primary-600); font-weight: 600; border-left-color: var(--primary); }
.msb-main { display: flex; flex-direction: column; min-width: 0; }
.msb-top { height: 64px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 0 28px; color: var(--text2); }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; color: var(--text); }
.pill .ic { width: 16px; height: 16px; }
.bell { position: relative; display: inline-flex; }
.bell i { position: absolute; top: -6px; right: -7px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 10px; font-style: normal; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; }
.user { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--line); color: var(--text); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #FDBA8C, #F26A21); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; }
.user b { display: block; font-size: 13.5px; } .user small { display: block; font-size: 11.5px; color: var(--text2); }
.content { padding: 22px 32px 40px; }

/* ---------- DMS shell ---------- */
.dms-app { min-height: var(--h); display: grid; grid-template-rows: 60px 1fr; }
.dms-top { background: var(--dms-head); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 24px; }
.dms-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #14B8A6, #0F766E); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.dms-top .brand b { display: block; font-size: 16px; letter-spacing: .3px; } .dms-top .brand small { display: block; font-size: 11px; color: #9FB0C6; }
.dms-search { margin-left: 28px; width: 360px; height: 36px; border-radius: 8px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #9FB0C6; font-size: 13px; }
.dms-top .user { border-left-color: rgba(255, 255, 255, .15); color: #fff; }
.dms-top .user small { color: #9FB0C6; }
.dms-top .avatar { background: linear-gradient(135deg, #5EEAD4, #0F766E); }
.dms-body { display: grid; grid-template-columns: 220px 1fr; }
.dms-side { background: #fff; border-right: 1px solid var(--line); padding: 16px 12px; }
.dms-side .nav-i.active { background: var(--dms-50); border-color: #B7DDD7; color: var(--dms); }
.dms-side .nav-i.active .ic { color: var(--dms); }
.dms-app .content { padding: 22px 28px 40px; }

/* ---------- page head ---------- */
.crumb { font-size: 12.5px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.crumb .ic { width: 12px; height: 12px; }
.crumb span:last-child { color: var(--text2); }
h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 4px; font-weight: 800; letter-spacing: -.2px; display: flex; align-items: center; gap: 12px; }
.sub { margin: 0; color: var(--text2); font-size: 14px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; }

/* ---------- cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h3 .ic { color: var(--text2); }
.card .desc { margin: 4px 0 0; color: var(--text2); font-size: 13px; }
.card.soft { background: var(--primary-50); border-color: var(--primary-100); }
.card.hl { border: 1.5px solid var(--primary); box-shadow: 0 0 0 4px rgba(242, 106, 33, .08); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.divider { height: 1px; background: var(--line2); margin: 18px 0; }

/* ---------- tags ---------- */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; letter-spacing: 0; }
.tag .ic { width: 13px; height: 13px; }
.tag.lg { height: 30px; padding: 0 12px; font-size: 13px; }
.tag.mini { height: 18px; padding: 0 7px; font-size: 10.5px; }
.t-orange { background: var(--primary-50); color: var(--primary-600); border: 1px solid var(--primary-100); }
.t-green { background: var(--green-50); color: var(--green); }
.t-red { background: var(--red-50); color: var(--red); }
.t-amber { background: var(--amber-50); color: var(--amber); }
.t-blue { background: var(--blue-50); color: var(--blue); }
.t-gray { background: #F1F3F5; color: var(--text2); }
.t-dash { background: #fff; color: var(--amber); border: 1px dashed #E7B458; }
.t-dms { background: var(--dms-50); color: var(--dms); }
.t-solid { background: var(--primary); color: #fff; }

/* ---------- buttons ---------- */
.btn { height: 42px; padding: 0 20px; border-radius: 8px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: filter .15s, background .15s; }
.btn .ic { width: 17px; height: 17px; }
.btn-lg { height: 48px; font-size: 15px; padding: 0 24px; }
.btn-sm { height: 34px; font-size: 13px; padding: 0 14px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(242, 106, 33, .28); }
.btn-primary:hover { background: var(--primary-600); }
.btn-outline { background: #fff; color: var(--primary-600); border-color: var(--primary); }
.btn-ghost { background: #fff; color: var(--text); border-color: #D7DBE1; }
.btn-ghost:hover { background: #F7F8FA; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger-o { background: #fff; color: var(--red); border-color: #F0B3B5; }
.btn-dms { background: var(--dms); color: #fff; }
.btn-dms:hover { background: var(--dms-600); }
.btn[disabled] { background: #F1F3F5; color: var(--text3); border-color: var(--line); box-shadow: none; cursor: not-allowed; }
.link { color: var(--primary-600); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; text-decoration: none; }
.link .ic { width: 14px; height: 14px; }
.link.dms { color: var(--dms); }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--text2); cursor: pointer; }
.icon-btn:hover { background: #F1F3F5; }

/* ---------- forms ---------- */
.label { font-size: 12.5px; color: var(--text2); margin-bottom: 6px; }
.input { height: 44px; border: 1px solid #D7DBE1; border-radius: 8px; background: #fff; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; }
.input.locked { background: #F6F7F9; color: var(--text); font-weight: 600; }
.input .ic { color: var(--text3); margin-left: auto; }
.input .ph { color: var(--text3); }
.cb { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid #B9C0CA; background: #fff; display: grid; place-items: center; flex: none; cursor: pointer; }
.cb .ic { width: 14px; height: 14px; color: #fff; stroke-width: 3; display: none; }
.cb.on { background: var(--primary); border-color: var(--primary); }
.cb.on .ic { display: block; }
.check-line { display: flex; gap: 12px; align-items: flex-start; font-size: 13.5px; }
.switch { width: 42px; height: 24px; border-radius: 12px; background: #D3D8DF; position: relative; flex: none; cursor: pointer; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: left .2s; }
.switch.on { background: var(--primary); }
.switch.on::after { left: 21px; }
.otp { display: flex; gap: 8px; }
.otp span { width: 44px; height: 50px; border: 1px solid #D7DBE1; border-radius: 8px; display: grid; place-items: center; font-size: 22px; font-weight: 700; background: #fff; }
.otp span.f::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
.otp span.cur { border: 2px solid var(--primary); box-shadow: 0 0 0 3px rgba(242, 106, 33, .15); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #B9C0CA; background: #fff; flex: none; display: grid; place-items: center; }
.radio.on { border-color: var(--primary); }
.radio.on::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.radio.dms.on { border-color: var(--dms); } .radio.dms.on::after { background: var(--dms); }

/* ---------- stepper ---------- */
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: var(--text3); text-align: center; }
.step::before { content: ''; position: absolute; top: 15px; left: calc(-50% + 22px); right: calc(50% + 22px); height: 2px; background: repeating-linear-gradient(90deg, #D3D8DF 0 6px, transparent 6px 10px); }
.step:first-child::before { display: none; }
.step.done::before, .step.now::before { background: var(--primary); }
.step .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #D3D8DF; background: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--text3); position: relative; z-index: 1; }
.step.done .dot { background: var(--primary); border-color: var(--primary); color: #fff; }
.step.done .dot .ic { width: 16px; height: 16px; stroke-width: 3; }
.step.now .dot { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 5px rgba(242, 106, 33, .14); }
.step.done, .step.now { color: var(--text); }
.step.now { font-weight: 700; }
.steps.dms .step.done::before, .steps.dms .step.now::before { background: var(--dms); }
.steps.dms .step.done .dot { background: var(--dms); border-color: var(--dms); }
.steps.dms .step.now .dot { border-color: var(--dms); color: var(--dms); box-shadow: 0 0 0 5px rgba(15, 118, 110, .14); }
.step small { display: block; font-size: 11.5px; color: var(--text3); font-weight: 500; margin-top: -4px; }

/* ---------- timeline ---------- */
.tl { position: relative; }
.tl-item { display: grid; grid-template-columns: 30px 1fr auto; column-gap: 12px; padding-bottom: 20px; position: relative; }
.tl-item::before { content: ''; position: absolute; left: 14px; top: 30px; bottom: 2px; width: 2px; background: var(--green); opacity: .5; }
.tl-item:last-child::before { display: none; }
.tl-item.todo::before, .tl-item.now::before { background: repeating-linear-gradient(180deg, #D3D8DF 0 5px, transparent 5px 9px); opacity: 1; }
.tl-ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.tl-ico .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.done .tl-ico { background: var(--green-50); color: var(--green); }
.now .tl-ico { background: var(--primary-50); color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
.todo .tl-ico { background: #F3F4F6; color: #B4BBC6; box-shadow: inset 0 0 0 1.5px #D3D8DF; }
.fail .tl-ico { background: var(--red-50); color: var(--red); }
.warn .tl-ico { background: var(--amber-50); color: var(--amber); }
.tl-item b { font-size: 14px; display: block; margin-top: 4px; }
.tl-item p { margin: 2px 0 0; font-size: 12.5px; color: var(--text2); }
.tl-item.todo b, .tl-item.todo p { color: var(--text3); font-weight: 500; }
.tl-item time { font-size: 12px; color: var(--text2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tl-item.now time { color: var(--primary-600); font-weight: 700; }
.screen.active:not(.noanim) .tl-item { animation: fadeUp .45s both; animation-delay: calc(var(--i) * .16s); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- kv / dl ---------- */
.kv { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--text2); }
.kv > b, .kv > span:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv.total { background: var(--primary-50); border: 0; border-radius: 8px; padding: 12px 14px; margin-top: 6px; }
.kv.total > b { color: var(--primary-600); font-size: 16px; }
.dl { display: grid; grid-template-columns: 138px 1fr; row-gap: 8px; column-gap: 12px; margin: 12px 0 0; font-size: 13.5px; }
.dl dt { color: var(--text2); }
.dl dd { margin: 0; font-weight: 500; }
.flow { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.flow .ic { width: 14px; height: 14px; color: var(--text3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 26px; padding: 0 10px; border-radius: 6px; background: #F3F4F6; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.fchip { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #D7DBE1; background: #fff; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.fchip .ic { width: 14px; height: 14px; color: var(--text3); }
.fchip.on { background: var(--text); color: #fff; border-color: var(--text); }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text2); background: #F7F8FA; padding: 10px 14px; white-space: nowrap; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td { padding: 12px 14px; border-top: 1px solid var(--line2); vertical-align: middle; }
.tbl td small { display: block; color: var(--text2); font-size: 12px; margin-top: 1px; }
.tbl tr.sel td { background: #FFF8F3; }
.tbl tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
.tbl-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card > .tbl-flush { margin: 0 -20px -20px; width: calc(100% + 40px); }
.card > .tbl-flush th:first-child, .card > .tbl-flush td:first-child { padding-left: 20px; }
.card > .tbl-flush th:last-child, .card > .tbl-flush td:last-child { padding-right: 20px; }
.prod { display: flex; align-items: center; gap: 12px; }
.thumb { width: 38px; height: 38px; border-radius: 8px; background: linear-gradient(135deg, #F1F5F4, #DDEAE7); display: grid; place-items: center; color: var(--dms); flex: none; }
.pos { color: var(--green); font-weight: 600; }
.neg { color: var(--red); font-weight: 600; }

/* ---------- alerts / toast ---------- */
.alert { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 12px; border: 1px solid; }
.alert .a-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.alert b { display: block; font-size: 14.5px; }
.alert p { margin: 2px 0 0; font-size: 13px; color: var(--text2); }
.alert .btn { margin-left: auto; align-self: center; }
.a-info { background: var(--blue-50); border-color: #CFE0FD; } .a-info .a-ico { background: #fff; color: var(--blue); }
.a-warn { background: var(--amber-50); border-color: #F5D9A3; } .a-warn .a-ico { background: #fff; color: var(--amber); }
.a-error { background: var(--red-50); border-color: #F6C6C8; } .a-error .a-ico { background: #fff; color: var(--red); }
.a-success { background: var(--green-50); border-color: #BFE6CF; } .a-success .a-ico { background: #fff; color: var(--green); }
.a-orange { background: var(--primary-50); border-color: var(--primary-100); } .a-orange .a-ico { background: #fff; color: var(--primary); }
.toast { position: absolute; right: 28px; top: 76px; z-index: 5; width: 460px; background: #1D2129; color: #fff; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; box-shadow: var(--shadow); }
.toast .t-ok { width: 26px; height: 26px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex: none; }
.toast .t-ok .ic { width: 15px; height: 15px; stroke-width: 3; }
.toast b { display: block; font-size: 13.5px; } .toast p { margin: 2px 0 0; font-size: 12.5px; color: #B8BFCA; }

/* ---------- misc components ---------- */
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.stat .s-l { font-size: 12.5px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
.stat .s-l .ic { width: 16px; height: 16px; color: var(--text3); }
.stat .s-v { font-size: 22px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.stat .s-n { font-size: 12px; color: var(--text3); margin-top: 2px; }
.bar { height: 10px; border-radius: 6px; background: #EEF0F3; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--primary); }
.bar i.b2 { background: #FDBA8C; }

.feature .ic { width: 16px; height: 16px; color: var(--primary); margin-top: 2px; }
.qr { background: #fff; padding: 10px; border: 1px solid var(--line); border-radius: 10px; display: inline-block; }

.doc .d-no { text-align: center; font-size: 11px; color: var(--text3); margin-top: 2px; }

.popt b { font-size: 14.5px; }
.popt .p-sub { font-size: 12.5px; color: var(--text2); margin-top: 2px; }

.tbl td .sub2 { display: block; color: var(--text2); font-size: 12px; margin-top: 3px; font-weight: 500; }

function qr(px = 150, seed = 7, logo = true) {
  const n = 25, m = px / n;
  let r = seed * 7919 + 17;
  const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  const inF = (i, j) => (i < 8 && j < 8) || (i < 8 && j > n - 9) || (i > n - 9 && j < 8) || (logo && i > 9 && i < 15 && j > 9 && j < 15);
  let o = '';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (!inF(i, j) && rnd() < 0.47) o += `<rect x="${(i * m).toFixed(2)}" y="${(j * m).toFixed(2)}" width="${(m + .3).toFixed(2)}" height="${(m + .3).toFixed(2)}"/>`;
  const f = (x, y) => `<rect x="${x * m}" y="${y * m}" width="${7 * m}" height="${7 * m}" rx="${m}"/><rect x="${(x + 1) * m}" y="${(y + 1) * m}" width="${5 * m}" height="${5 * m}" fill="#fff" rx="${m * .6}"/><rect x="${(x + 2) * m}" y="${(y + 2) * m}" width="${3 * m}" height="${3 * m}" rx="${m * .5}"/>`;
  const lg = logo ? `<rect x="${10.3 * m}" y="${10.3 * m}" width="${4.4 * m}" height="${4.4 * m}" rx="${m}" fill="#EF4029"/><text x="${12.5 * m}" y="${13 * m}" font-size="${m * 1.45}" font-weight="800" fill="#fff" text-anchor="middle" font-family="Be Vietnam Pro, Arial">MSB</text>` : '';
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" fill="#1D2129">${o}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}${lg}</svg>`;
}

function gauge(v, max = 1000, th = 700, grade = 'B+') {
  const R = 86, cx = 110, cy = 112;
  const pt = (t, rr = R) => { const a = Math.PI * (1 - t); return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; };
  const [x1, y1] = pt(v / max);
  const [ta, tb] = [pt(th / max, R - 13), pt(th / max, R + 13)];
  const [lx, ly] = pt(th / max, R + 26);
  return `<div class="gauge"><svg width="220" height="128" viewBox="0 0 220 128">
    <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#FDBA8C"/><stop offset="1" stop-color="#F26A21"/></linearGradient></defs>
    <path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy}" stroke="#EEF0F3" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="url(#gg)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <line x1="${ta[0].toFixed(1)}" y1="${ta[1].toFixed(1)}" x2="${tb[0].toFixed(1)}" y2="${tb[1].toFixed(1)}" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round"/>
    <text x="${lx.toFixed(1)}" y="${(ly + 2).toFixed(1)}" font-size="10.5" font-weight="700" fill="#5B6472" text-anchor="middle" font-family="Be Vietnam Pro, Arial">${th}</text>
  </svg><div class="g-v">${v}</div><div class="g-s">/ ${max} · Hạng ${grade}</div></div>`;
}

  { code: '02', title: 'DMS · Tạo đơn hàng – chọn PO-Express', time: '22/09/2026 14:04', h: 1000, fn: s02 },
  { code: '03', title: 'Thẩm định đơn hàng tự động', time: '22/09/2026 14:05', h: 960, fn: s03 },
  { code: '04', title: 'Xác nhận khoản vay & ký số', time: '22/09/2026 14:07', h: 1000, fn: s04 },

];

/* ================= Router & presenter ================= */
const Q = new URLSearchParams(location.search);
const EXPORT = Q.has('export') || Q.has('measure');
const stage = document.getElementById('stage');
let cur = '01';

function render() {
  stage.innerHTML = SCREENS.map(s => `<section class="screen ${EXPORT ? 'noanim' : ''}" data-code="${s.code}" style="--h:${s.h}px">${s.fn()}</section>`).join('');
}

function show(code, push = true) {
  const s = SCREENS.find(x => x.code === code) || SCREENS[0];
  cur = s.code;
  document.querySelectorAll('.screen').forEach(el => {
    const on = el.dataset.code === cur;
    el.classList.toggle('active', on);
    if (on && !EXPORT) { el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
  });
  if (push) history.replaceState(null, '', `${location.pathname}${location.search}#/${cur}`);
  document.title = `${cur} · ${s.title} — PO-Express`;
  const sel = document.getElementById('p-sel'); if (sel) sel.value = cur;
  const t = document.getElementById('p-time'); if (t) t.textContent = s.time;
  window.scrollTo(0, 0);
  fit();
}

function step(d) { const i = SCREENS.findIndex(s => s.code === cur); show(SCREENS[(i + d + SCREENS.length) % SCREENS.length].code); }

function fit() {
  if (EXPORT) { stage.style.zoom = 1; return; }
  stage.style.zoom = Math.min(1, window.innerWidth / 1440);
}

function loader(msg, ms, then) {
  const [t, p] = msg.split('|');
  const el = document.getElementById('loader');
  el.innerHTML = `<div class="l-card"><div class="spin"></div><div><b>${t}</b>${p ? `<p>${p}</p>` : ''}</div></div>`;
  el.classList.add('on');
  setTimeout(() => { el.classList.remove('on'); then(); }, ms);
}

function presenter() {
  const bar = document.getElementById('presenter');
  bar.innerHTML = `<button id="p-prev" title="Màn trước (←)">${ic('left')}</button>
    <select id="p-sel">${SCREENS.map(s => `<option value="${s.code}">${s.code} · ${s.title}</option>`).join('')}</select>
    <button id="p-next" title="Màn sau (→)">${ic('right')}</button><span class="sep"></span>
    <span class="p-time">${ic('clock')} <span id="p-time"></span></span><span class="sep"></span>
    <button id="p-hint" title="Hiện vùng bấm được">${ic('eye')} Vùng bấm</button>
    <button id="p-full" title="Toàn màn hình (F)">${ic('ext')}</button>`;
  document.getElementById('p-prev').onclick = () => step(-1);
  document.getElementById('p-next').onclick = () => step(1);
  document.getElementById('p-sel').onchange = e => show(e.target.value);
  document.getElementById('p-hint').onclick = e => { document.body.classList.toggle('hints-on'); e.currentTarget.classList.toggle('on'); };
  document.getElementById('p-full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) {
    e.preventDefault();
    const to = g.dataset.go;
    if (g.dataset.wait) loader(g.dataset.wait, +(g.dataset.ms || 1500), () => show(to)); else show(to);
    return;
  }
  const t = e.target.closest('.switch'); if (t) { t.classList.toggle('on'); return; }
  const c = e.target.closest('.cb'); if (c) { c.classList.toggle('on'); return; }
  const p = e.target.closest('.popt:not(.dis)');
  if (p) { p.parentElement.querySelectorAll('.popt').forEach(x => { x.classList.toggle('on', x === p); const r = x.querySelector('.radio'); if (r && !x.classList.contains('dis')) r.classList.toggle('on', x === p); }); return; }
  if (!e.target.closest('#presenter,button,a,.popt,.fchip')) {
    document.body.classList.add('hint'); clearTimeout(window.__h); window.__h = setTimeout(() => document.body.classList.remove('hint'), 900);
  }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'f' || e.key === 'F') document.getElementById('p-full')?.click();
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('bare');
});
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => { const m = location.hash.match(/#\/(\d\d)/); if (m && m[1] !== cur) show(m[1], false); });

render();
if (EXPORT) document.body.classList.add('export'); else presenter();
const start = (location.hash.match(/#\/(\d\d)/) || [])[1] || '01';
show(start, false);

if (Q.has('measure')) {
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    const out = {};
    SCREENS.forEach(s => { show(s.code, false); out[s.code] = Math.max(s.h, Math.ceil(document.querySelector('.screen.active').scrollHeight)); });
    const pre = document.createElement('pre'); pre.id = 'heights'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
  });
}
